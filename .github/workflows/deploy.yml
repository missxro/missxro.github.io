name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde GitHub si hace falta

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false  # si se hacen dos pushes seguidos, espera a que acabe el primero

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist          # Astro siempre compila a /dist

  deploy:
    name: Deploy
    needs: build              # espera a que el job de build termine bien
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4